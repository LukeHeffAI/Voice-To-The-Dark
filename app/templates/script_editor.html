<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Edit Script — {{ story.title }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 1rem;
        }

        .back-link {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 0.5rem 0;
            display: inline-block;
        }
        .back-link:hover { color: #ccc; }

        .page-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1rem 0 1.5rem;
            border-bottom: 1px solid #1a1a1a;
            margin-bottom: 1rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .page-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f0f0f0;
        }
        .page-header .subtitle {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.2rem;
        }

        .save-btn {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 8px;
            background: #c0392b;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .save-btn:hover { background: #a93226; }
        .save-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .save-status {
            font-size: 0.8rem;
            color: #666;
            text-align: right;
            margin-top: 0.3rem;
        }
        .save-status.error { color: #e07070; }
        .save-status.success { color: #4caf50; }

        /* ── Characters panel ────────────────────────────── */
        .characters-panel {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
        }
        .characters-panel h2 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 0.75rem;
        }
        .character-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .character-tag {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .character-tag.narrator {
            background: #1a2e1a;
            color: #4caf50;
            border: 1px solid #2e4a2e;
        }
        .character-tag.dialogue {
            background: #1a1a2e;
            color: #8888cc;
            border: 1px solid #2a2a4e;
        }
        .character-profile {
            color: #666;
            font-style: italic;
        }

        /* ── Segments list ───────────────────────────────── */
        .segments-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        .segments-header h2 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ccc;
        }
        .segment-count {
            font-size: 0.8rem;
            color: #555;
        }

        .segment-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .segment-card {
            background: #111;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: border-color 0.15s;
        }
        .segment-card:hover { border-color: #2a2a2a; }
        .segment-card.editing { border-color: #c0392b; }

        .segment-top {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }
        .segment-type {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            letter-spacing: 0.03em;
        }
        .type-narration { background: #1a2e1a; color: #4caf50; }
        .type-dialogue { background: #1a1a2e; color: #8888cc; }
        .type-sfx { background: #2e2e1a; color: #cccc44; }
        .type-ambient { background: #1a2e2e; color: #44cccc; }
        .type-pause { background: #1a1a1a; color: #888; }

        .segment-character {
            font-size: 0.8rem;
            color: #999;
            font-weight: 500;
        }
        .segment-tone {
            font-size: 0.75rem;
            color: #665;
            font-style: italic;
            margin-left: auto;
        }
        .segment-index {
            font-size: 0.7rem;
            color: #444;
            margin-left: auto;
        }

        .segment-text {
            font-size: 0.85rem;
            color: #ccc;
            line-height: 1.4;
            word-break: break-word;
        }
        .segment-description {
            font-size: 0.85rem;
            color: #999;
            font-style: italic;
        }

        /* ── Inline edit fields ──────────────────────────── */
        .segment-edit {
            display: none;
            margin-top: 0.5rem;
            flex-direction: column;
            gap: 0.4rem;
        }
        .segment-card.editing .segment-edit { display: flex; }
        .segment-card.editing .segment-display { display: none; }

        .edit-field {
            width: 100%;
            padding: 0.5rem 0.7rem;
            border: 1px solid #333;
            border-radius: 6px;
            background: #0a0a0a;
            color: #e0e0e0;
            font-size: 0.85rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
        }
        .edit-field:focus { border-color: #c0392b; }

        textarea.edit-field { min-height: 60px; }

        .edit-row {
            display: flex;
            gap: 0.5rem;
        }
        .edit-row .edit-field { flex: 1; }

        .edit-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.3rem;
        }
        .edit-btn {
            padding: 0.35rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .edit-btn-save { background: #1a2e1a; color: #4caf50; }
        .edit-btn-save:hover { background: #2e4a2e; }
        .edit-btn-cancel { background: #1a1a1a; color: #888; }
        .edit-btn-cancel:hover { background: #222; }
        .edit-btn-delete { background: #2e1a1a; color: #e07070; }
        .edit-btn-delete:hover { background: #4e2a2a; }

        .click-hint {
            font-size: 0.75rem;
            color: #444;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <a href="/story/{{ story.id }}" class="back-link">&larr; Back to story</a>

        <div class="page-header">
            <div>
                <h1>Edit Script</h1>
                <div class="subtitle">{{ story.title }}</div>
            </div>
            <div>
                <button class="save-btn" id="saveBtn" onclick="saveScript()">Save Changes</button>
                <div class="save-status" id="saveStatus"></div>
            </div>
        </div>

        <!-- Characters -->
        <div class="characters-panel">
            <h2>Characters</h2>
            <div class="character-list" id="characterList"></div>
        </div>

        <!-- Segments -->
        <div class="segments-header">
            <h2>Segments</h2>
            <div class="segment-count" id="segmentCount"></div>
        </div>
        <p class="click-hint">Tap a segment to edit it</p>
        <div class="segment-list" id="segmentList"></div>
    </div>

    <script>
    const storyId = {{ story.id }};
    let script = {{ script_json | safe }};
    let hasChanges = false;

    function render() {
        renderCharacters();
        renderSegments();
    }

    function renderCharacters() {
        const container = document.getElementById('characterList');
        container.innerHTML = '';
        for (const [key, profile] of Object.entries(script.characters)) {
            const tag = document.createElement('div');
            tag.className = 'character-tag ' + (key === 'narrator' ? 'narrator' : 'dialogue');
            tag.innerHTML =
                '<span>' + escapeHtml(key) + '</span>' +
                '<span class="character-profile">' + escapeHtml(profile.voice_profile) + '</span>';
            container.appendChild(tag);
        }
    }

    function renderSegments() {
        const container = document.getElementById('segmentList');
        const countEl = document.getElementById('segmentCount');
        container.innerHTML = '';
        countEl.textContent = script.segments.length + ' segments';

        script.segments.forEach((seg, i) => {
            const card = document.createElement('div');
            card.className = 'segment-card';
            card.dataset.index = i;

            const typeClass = 'type-' + seg.type;
            const isVoice = seg.type === 'narration' || seg.type === 'dialogue';
            const isPause = seg.type === 'pause';

            // Display view
            let displayHtml = '<div class="segment-display">';
            if (isVoice) {
                displayHtml += '<div class="segment-text">' + escapeHtml(seg.text || '') + '</div>';
            } else if (isPause) {
                displayHtml += '<div class="segment-description">' + (seg.duration_ms || 1500) + 'ms pause</div>';
            } else {
                displayHtml += '<div class="segment-description">' + escapeHtml(seg.description || '') + '</div>';
            }
            displayHtml += '</div>';

            // Edit view
            let editHtml = '<div class="segment-edit">';
            if (isVoice) {
                editHtml += '<textarea class="edit-field" data-field="text">' + escapeHtml(seg.text || '') + '</textarea>';
                editHtml += '<div class="edit-row">';
                editHtml += '<input class="edit-field" data-field="tone" placeholder="Tone (e.g. foreboding)" value="' + escapeAttr(seg.tone || '') + '">';
                editHtml += '<input class="edit-field" data-field="character" placeholder="Character" value="' + escapeAttr(seg.character || '') + '">';
                editHtml += '</div>';
            } else if (isPause) {
                editHtml += '<input class="edit-field" type="number" data-field="duration_ms" placeholder="Duration (ms)" value="' + (seg.duration_ms || 1500) + '">';
            } else {
                editHtml += '<textarea class="edit-field" data-field="description">' + escapeHtml(seg.description || '') + '</textarea>';
            }
            editHtml += '<div class="edit-actions">';
            editHtml += '<button class="edit-btn edit-btn-save" onclick="confirmEdit(' + i + ')">Done</button>';
            editHtml += '<button class="edit-btn edit-btn-cancel" onclick="cancelEdit(' + i + ')">Cancel</button>';
            editHtml += '<button class="edit-btn edit-btn-delete" onclick="deleteSegment(' + i + ')">Delete</button>';
            editHtml += '</div>';
            editHtml += '</div>';

            card.innerHTML =
                '<div class="segment-top">' +
                    '<span class="segment-type ' + typeClass + '">' + seg.type + '</span>' +
                    (seg.character ? '<span class="segment-character">' + escapeHtml(seg.character) + '</span>' : '') +
                    (seg.tone ? '<span class="segment-tone">' + escapeHtml(seg.tone) + '</span>' : '') +
                    '<span class="segment-index">#' + (i + 1) + '</span>' +
                '</div>' +
                displayHtml + editHtml;

            card.addEventListener('click', (e) => {
                if (e.target.closest('.segment-edit') || e.target.closest('.edit-btn')) return;
                toggleEdit(card);
            });

            container.appendChild(card);
        });
    }

    function toggleEdit(card) {
        // Close other open editors
        document.querySelectorAll('.segment-card.editing').forEach(c => {
            if (c !== card) c.classList.remove('editing');
        });
        card.classList.toggle('editing');
        if (card.classList.contains('editing')) {
            const firstField = card.querySelector('.edit-field');
            if (firstField) firstField.focus();
        }
    }

    function confirmEdit(index) {
        const card = document.querySelector('[data-index="' + index + '"]');
        const fields = card.querySelectorAll('.edit-field');

        fields.forEach(field => {
            const key = field.dataset.field;
            if (key === 'duration_ms') {
                script.segments[index][key] = parseInt(field.value) || 1500;
            } else {
                script.segments[index][key] = field.value;
            }
        });

        hasChanges = true;
        card.classList.remove('editing');
        renderSegments();
    }

    function cancelEdit(index) {
        const card = document.querySelector('[data-index="' + index + '"]');
        card.classList.remove('editing');
        renderSegments();
    }

    function deleteSegment(index) {
        if (!confirm('Delete this segment?')) return;
        script.segments.splice(index, 1);
        hasChanges = true;
        renderSegments();
    }

    async function saveScript() {
        const btn = document.getElementById('saveBtn');
        const status = document.getElementById('saveStatus');

        btn.disabled = true;
        btn.textContent = 'Saving...';
        status.textContent = '';

        try {
            const resp = await fetch('/audio/script/' + storyId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(script),
            });

            if (resp.ok) {
                status.textContent = 'Saved';
                status.className = 'save-status success';
                hasChanges = false;
            } else {
                const data = await resp.json();
                throw new Error(data.detail || 'Save failed');
            }
        } catch (err) {
            status.textContent = err.message;
            status.className = 'save-status error';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Save Changes';
        }
    }

    // Warn before leaving with unsaved changes
    window.addEventListener('beforeunload', (e) => {
        if (hasChanges) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    function escapeHtml(text) {
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }

    function escapeAttr(text) {
        return text.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    render();
    </script>
</body>
</html>
