<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Sign In — Voice To The Dark</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 380px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #c0392b;
        }
        .auth-header p {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.3rem;
        }

        .tab-bar {
            display: flex;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #1a1a1a;
        }
        .tab {
            flex: 1;
            padding: 0.75rem;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .tab:hover { color: #ccc; }
        .tab.active {
            color: #c0392b;
            border-bottom-color: #c0392b;
        }

        .form-panel { display: none; }
        .form-panel.active { display: block; }

        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 0.3rem;
        }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #333;
            border-radius: 8px;
            background: #111;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-input:focus { border-color: #c0392b; }

        .form-submit {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: #c0392b;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 0.5rem;
        }
        .form-submit:hover { background: #a93226; }
        .form-submit:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
        }

        .form-message {
            margin-top: 0.75rem;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
        }
        .form-message.error {
            display: block;
            background: #2e1a1a;
            border: 1px solid #4e2a2a;
            color: #e07070;
        }
        .form-message.success {
            display: block;
            background: #1a2e1a;
            border: 1px solid #2e4a2e;
            color: #70e070;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #555;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover { color: #888; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Voice To The Dark</h1>
            <p>Sign in to submit stories and generate narrations</p>
        </div>

        <div class="tab-bar">
            <button class="tab active" onclick="switchTab('login')">Sign In</button>
            <button class="tab" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- Login form -->
        <div class="form-panel active" id="loginPanel">
            <div class="form-group">
                <label class="form-label" for="loginUser">Username</label>
                <input class="form-input" id="loginUser" type="text" autocomplete="username" autocapitalize="off">
            </div>
            <div class="form-group">
                <label class="form-label" for="loginPass">Password</label>
                <input class="form-input" id="loginPass" type="password" autocomplete="current-password">
            </div>
            <button class="form-submit" id="loginBtn" onclick="doLogin()">Sign In</button>
            <div class="form-message" id="loginMsg"></div>
        </div>

        <!-- Register form -->
        <div class="form-panel" id="registerPanel">
            <div class="form-group">
                <label class="form-label" for="regUser">Username</label>
                <input class="form-input" id="regUser" type="text" autocomplete="username" autocapitalize="off">
            </div>
            <div class="form-group">
                <label class="form-label" for="regPass">Password</label>
                <input class="form-input" id="regPass" type="password" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="regPass2">Confirm Password</label>
                <input class="form-input" id="regPass2" type="password" autocomplete="new-password">
            </div>
            <button class="form-submit" id="regBtn" onclick="doRegister()">Create Account</button>
            <div class="form-message" id="regMsg"></div>
        </div>

        <a href="/" class="back-link">&larr; Back to stories</a>
    </div>

    <script>
    const nextUrl = new URLSearchParams(window.location.search).get('next') || '/';

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));

        if (tab === 'login') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('loginPanel').classList.add('active');
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('registerPanel').classList.add('active');
        }
    }

    async function doLogin() {
        const username = document.getElementById('loginUser').value.trim();
        const password = document.getElementById('loginPass').value;
        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('loginMsg');

        if (!username || !password) {
            showMsg(msg, 'Please fill in all fields.', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Signing in...';
        msg.className = 'form-message';

        try {
            const resp = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            const data = await resp.json();

            if (resp.ok) {
                showMsg(msg, 'Signed in!', 'success');
                window.location.href = nextUrl;
            } else {
                showMsg(msg, data.detail || 'Login failed.', 'error');
            }
        } catch (err) {
            showMsg(msg, 'Network error.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    }

    async function doRegister() {
        const username = document.getElementById('regUser').value.trim();
        const password = document.getElementById('regPass').value;
        const password2 = document.getElementById('regPass2').value;
        const btn = document.getElementById('regBtn');
        const msg = document.getElementById('regMsg');

        if (!username || !password || !password2) {
            showMsg(msg, 'Please fill in all fields.', 'error');
            return;
        }
        if (password !== password2) {
            showMsg(msg, 'Passwords do not match.', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating...';
        msg.className = 'form-message';

        try {
            const resp = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });
            const data = await resp.json();

            if (resp.ok) {
                showMsg(msg, 'Account created!', 'success');
                window.location.href = nextUrl;
            } else {
                showMsg(msg, data.detail || 'Registration failed.', 'error');
            }
        } catch (err) {
            showMsg(msg, 'Network error.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    }

    function showMsg(el, text, type) {
        el.textContent = text;
        el.className = 'form-message ' + type;
    }

    // Submit on Enter
    document.querySelectorAll('.form-input').forEach(input => {
        input.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter') return;
            const panel = input.closest('.form-panel');
            if (panel.id === 'loginPanel') doLogin();
            else doRegister();
        });
    });
    </script>
</body>
</html>
