<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0{% block viewport_extra %}{% endblock %}">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Voice In The Dark">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>{% block title %}Voice In The Dark{% endblock %}</title>
    <style>
        :root {
            --bg: #050505;
            --surface: rgba(255,255,255,0.025);
            --surface-hover: rgba(255,255,255,0.04);
            --surface-active: rgba(255,255,255,0.055);
            --elevated: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --border-focus: rgba(160,32,32,0.5);
            --text-1: #e8e6e3;
            --text-2: #8a8a8a;
            --text-3: #555;
            --accent: #a02020;
            --accent-hover: #bf2626;
            --accent-dim: rgba(160,32,32,0.12);
            --accent-glow: 0 0 30px rgba(160,32,32,0.2);
            --success: #3a7d5c;
            --success-dim: rgba(58,125,92,0.12);
            --info: #6868b8;
            --info-dim: rgba(104,104,184,0.12);
            --warn: #b8a040;
            --warn-dim: rgba(184,160,64,0.12);
            --ambient: #48b8b8;
            --ambient-dim: rgba(72,184,184,0.1);
            --error: #c44;
            --error-dim: rgba(204,68,68,0.1);
            --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --r-sm: 6px;
            --r-md: 10px;
            --r-lg: 16px;
            --r-xl: 24px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            background-image: radial-gradient(ellipse at 50% 0%, #0a0808 0%, var(--bg) 70%);
            color: var(--text-1);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 15px;
            line-height: 1.5;
        }
        body.has-miniplayer { padding-bottom: 60px; }
        /* Film grain overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 10000;
        }
        /* Vignette */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.35) 100%);
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Drifting fog atmosphere ────────────────────────── */
        .fog {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            -webkit-clip-path: inset(0);
            clip-path: inset(0);
            opacity: 0; /* JS adds .settle / .visible / .evaporate */
        }
        .fog.visible { opacity: 1; }
        /* Shared geometry for all three layers */
        .fog::before,
        .fog::after,
        .fog-l3 {
            position: absolute;
            bottom: -12%;
            left: -150%;
            width: 1000%;
            height: 200%;
            filter: blur(35px);
            will-change: transform;
        }
        .fog::before, .fog::after { content: ''; }
        /* Layer 1 — dense base, sweeps left, opacity dips at midpoint */
        .fog::before {
            background:
                radial-gradient(ellipse 18% 55% at  5% 100%, rgba(195,192,215,0.17) 0%, transparent 70%),
                radial-gradient(ellipse 22% 52% at 22% 100%, rgba(178,174,200,0.14) 0%, transparent 65%),
                radial-gradient(ellipse 18% 48% at 40% 100%, rgba(188,184,210,0.13) 0%, transparent 62%),
                radial-gradient(ellipse 22% 55% at 58% 100%, rgba(175,172,196,0.16) 0%, transparent 68%),
                radial-gradient(ellipse 18% 50% at 75% 100%, rgba(165,162,186,0.12) 0%, transparent 63%),
                radial-gradient(ellipse 22% 52% at 92% 100%, rgba(182,178,205,0.15) 0%, transparent 66%);
            animation: fog-drift-1 18s ease-in-out infinite alternate;
        }
        /* Layer 2 — lighter wisps, opposing drift, opacity peaks at midpoint */
        .fog::after {
            background:
                radial-gradient(ellipse 20% 50% at 12%  95%, rgba(196,192,216,0.09) 0%, transparent 62%),
                radial-gradient(ellipse 22% 54% at 30% 100%, rgba(182,178,205,0.11) 0%, transparent 67%),
                radial-gradient(ellipse 20% 48% at 49%  95%, rgba(195,190,214,0.08) 0%, transparent 62%),
                radial-gradient(ellipse 22% 52% at 67% 100%, rgba(178,174,200,0.10) 0%, transparent 65%),
                radial-gradient(ellipse 20% 50% at 85%  95%, rgba(190,186,210,0.09) 0%, transparent 63%);
            animation: fog-drift-2 12s ease-in-out infinite alternate;
        }
        /* Layer 3 — wispy upper tendrils, faster tighter sweep, irregular opacity */
        .fog-l3 {
            height: 350%;
            filter: blur(42px);
            background:
                radial-gradient(ellipse 20% 46% at  8%  92%, rgba(200,196,218,0.14) 0%, transparent 63%),
                radial-gradient(ellipse 18% 50% at 28% 100%, rgba(185,182,206,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 20% 44% at 48%  92%, rgba(192,188,212,0.13) 0%, transparent 61%),
                radial-gradient(ellipse 18% 48% at 68% 100%, rgba(180,176,202,0.12) 0%, transparent 62%),
                radial-gradient(ellipse 20% 46% at 88%  92%, rgba(196,192,215,0.14) 0%, transparent 63%);
            animation: fog-drift-3 7s ease-in-out infinite alternate;
        }
        /* Layer 1: full → dim at peak travel → full */
        @keyframes fog-drift-1 {
            0%   { opacity: 1.0;  transform: translate(0,      0); }
            8%   {               transform: translate(-16vw,  -0.4vh); }
            17%  {               transform: translate(-34vw, -0.9vh); }
            25%  { opacity: 0.6; transform: translate(-50vw, -1.3vh); }
            33%  {               transform: translate(-66vw, -1.7vh); }
            42%  {               transform: translate(-84vw, -2vh); }
            50%  { opacity: 0.4; transform: translate(-100vw, -2vh); }
            58%  {               transform: translate(-84vw, -1.7vh); }
            67%  {               transform: translate(-66vw, -1.3vh); }
            75%  { opacity: 0.6; transform: translate(-50vw, -0.9vh); }
            83%  {               transform: translate(-34vw, -0.4vh); }
            92%  {               transform: translate(-16vw,  0); }
            100% { opacity: 1.0; transform: translate(0,     0); }
        }
        /* Layer 2: dim → bright at peak travel → dim (counter-phase) */
        @keyframes fog-drift-2 {
            0%   { opacity: 0.3; transform: translate(0,     0); }
            8%   {               transform: translate(10vw,   0.4vh); }
            17%  {               transform: translate(22vw,  0.9vh); }
            25%  { opacity: 0.75; transform: translate(32vw,  1.4vh); }
            33%  {               transform: translate(42vw,  1.8vh); }
            42%  {               transform: translate(54vw,  2vh); }
            50%  { opacity: 0.8; transform: translate(64vw,  2vh); }
            58%  {               transform: translate(54vw,  1.8vh); }
            67%  {               transform: translate(42vw,  1.4vh); }
            75%  { opacity: 0.75; transform: translate(32vw,  0.9vh); }
            83%  {               transform: translate(22vw,  0.4vh); }
            92%  {               transform: translate(10vw,   0); }
            100% { opacity: 0.3; transform: translate(0,     0); }
        }
        /* Layer 3: two-dip opacity breathing, shorter oscillation, faster cycle */
        @keyframes fog-drift-3 {
            0%   { opacity: 0.75; transform: translate(0,      0); }
            8%   {                transform: translate(-10vw,  -0.3vh); }
            17%  {                transform: translate(-20vw, -0.7vh); }
            25%  { opacity: 0.2;  transform: translate(-30vw, -1.1vh); }
            33%  {                transform: translate(-40vw, -1.5vh); }
            42%  {                transform: translate(-30vw, -1.1vh); }
            50%  { opacity: 0.75; transform: translate(-20vw, -0.7vh); }
            58%  {                transform: translate(-10vw,  -0.3vh); }
            67%  {                transform: translate(0,      0); }
            75%  { opacity: 0.2;  transform: translate(10vw,   0.3vh); }
            83%  {                transform: translate(20vw,  0.7vh); }
            92%  {                transform: translate(10vw,   0.3vh); }
            100% { opacity: 0.75; transform: translate(0,     0); }
        }
        /* Settle — fog rolls in from the bottom */
        .fog.settle {
            animation: fog-settle 3.5s ease-out forwards;
        }
        @keyframes fog-settle {
            0%   { opacity: 0; transform: translateY(8vh); }
            100% { opacity: 1; transform: translateY(0); }
        }
        /* Evaporate — fog thins and disperses sideways */
        .fog.evaporate {
            opacity: 1;
            animation: fog-evaporate 3s ease-in forwards;
        }
        @keyframes fog-evaporate {
            0%   { opacity: 1; transform: translate(0, 0) scale(1); }
            40%  { opacity: 0.55; transform: translate(0, 4vh) scale(1.5); }
            100% { opacity: 0; transform: translate(0, 10vh) scale(2); }
        }

        /* ── Shared components ─────────────────────────────── */

        .auth-nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1.25rem;
            padding: 0.75rem 0;
            font-size: 0.8rem;
        }
        .auth-nav a {
            color: var(--text-3);
            text-decoration: none;
            transition: color 0.2s var(--ease);
            letter-spacing: 0.02em;
        }
        .auth-nav a:hover { color: var(--text-2); }
        .auth-nav a:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 3px;
            border-radius: var(--r-sm);
        }
        .auth-nav .username {
            color: var(--text-2);
            font-weight: 500;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-3);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 0.5rem 0;
            transition: color 0.2s var(--ease);
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .back-link:hover { color: var(--text-2); }
        .back-link:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 3px;
            border-radius: var(--r-sm);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            border: none;
            border-radius: var(--r-md);
            background: var(--accent);
            color: #fff;
            font-family: var(--serif);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s var(--ease);
            letter-spacing: 0.02em;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: var(--accent-glow);
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            box-shadow: var(--accent-glow);
        }
        .btn-primary:disabled {
            background: rgba(255,255,255,0.06);
            color: var(--text-3);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.55rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            background: transparent;
            color: var(--text-2);
            font-family: var(--serif);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s var(--ease);
            letter-spacing: 0.02em;
        }
        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-1);
            background: var(--surface);
        }
        .btn-secondary:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 3px;
            border-color: var(--border-focus);
        }

        .form-message {
            margin-top: 0.75rem;
            padding: 0.7rem 1rem;
            border-radius: var(--r-sm);
            font-size: 0.82rem;
            display: none;
            line-height: 1.4;
        }
        .form-message.error {
            display: block;
            background: var(--error-dim);
            border: 1px solid rgba(204,68,68,0.2);
            color: #e07070;
        }
        .form-message.success {
            display: block;
            background: var(--success-dim);
            border: 1px solid rgba(58,125,92,0.2);
            color: #6ecf9a;
        }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.55rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.4rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .step-status { font-size: 0.8rem; color: var(--text-3); margin-top: 0.5rem; }
        .step-status.error { color: #e07070; }
        .step-status.success { color: var(--success); }

        .login-prompt {
            text-align: center;
            padding: 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            font-size: 0.85rem;
            color: var(--text-2);
        }
        .login-prompt a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .login-prompt a:hover { text-decoration: underline; }

        /* ── Winks currency badge ────────────────────────── */
        .winks-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            background: var(--warn-dim);
            border: 1px solid rgba(184,160,64,0.15);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--warn);
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .winks-badge-icon {
            font-size: 0.75rem;
            line-height: 1;
        }
        .winks-estimate {
            color: var(--warn);
            font-weight: 500;
            white-space: nowrap;
        }
        /* ── Toast notification (shared) ──────────────────── */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 0.65rem 1.3rem;
            background: #1a1a1a;
            border: 1px solid var(--border-hover);
            border-radius: var(--r-md);
            color: var(--text-1);
            font-size: 0.8rem;
            z-index: 10001;
            opacity: 0;
            transition: all 0.35s var(--ease);
            pointer-events: none;
        }
        body.has-miniplayer .toast { bottom: 4.5rem; }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── Mini-Player Bar ─────────────────────────────── */
        .mini-player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: rgba(10,10,10,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            z-index: 9000;
            display: none;
            flex-direction: column;
        }
        .mini-player.visible { display: flex; }

        .mini-progress {
            width: 100%;
            height: 3px;
            background: rgba(255,255,255,0.06);
            cursor: pointer;
            flex-shrink: 0;
        }
        .mini-progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s linear;
            pointer-events: none;
        }

        .mini-player-inner {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 0.75rem;
            gap: 0.5rem;
        }

        .mini-controls {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            flex-shrink: 0;
        }
        .mini-btn {
            background: none;
            border: none;
            color: var(--text-2);
            cursor: pointer;
            padding: 0.4rem;
            font-size: 1rem;
            transition: color 0.15s var(--ease);
            -webkit-tap-highlight-color: transparent;
            line-height: 1;
        }
        .mini-btn:hover { color: var(--text-1); }
        .mini-btn.play-pause { font-size: 1.2rem; color: var(--text-1); }

        .mini-info {
            flex: 1;
            min-width: 0;
            cursor: pointer;
            padding: 0 0.5rem;
        }
        .mini-info a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .mini-title {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mini-author {
            font-size: 0.7rem;
            color: var(--text-3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mini-right {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            flex-shrink: 0;
        }
        .mini-btn.repeat-active { color: var(--accent); }
        .mini-btn .repeat-one-dot {
            display: none;
            font-size: 0.55rem;
            vertical-align: super;
            font-weight: 700;
        }
        .mini-btn.repeat-one .repeat-one-dot { display: inline; }

        /* ── Playlist Drawer ─────────────────────────────── */
        .drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 8998;
            display: none;
        }
        .drawer-backdrop.open { display: block; }

        .playlist-drawer {
            position: fixed;
            bottom: 56px;
            left: 0;
            right: 0;
            max-height: 60vh;
            background: #0e0e0e;
            border-top: 1px solid var(--border-hover);
            border-radius: var(--r-lg) var(--r-lg) 0 0;
            z-index: 8999;
            transform: translateY(100%);
            transition: transform 0.3s var(--ease);
            display: flex;
            flex-direction: column;
        }
        .playlist-drawer.open { transform: translateY(0); }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem 0.75rem;
            flex-shrink: 0;
        }
        .drawer-title {
            font-family: var(--serif);
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-1);
            letter-spacing: 0.04em;
        }
        .drawer-clear {
            background: none;
            border: none;
            color: var(--text-3);
            font-family: var(--serif);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: var(--r-sm);
            transition: all 0.15s var(--ease);
        }
        .drawer-clear:hover { color: var(--error); background: var(--error-dim); }

        .drawer-list {
            list-style: none;
            overflow-y: auto;
            padding: 0 0.75rem 0.75rem;
            flex: 1;
        }

        .drawer-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.5rem;
            border-radius: var(--r-sm);
            cursor: pointer;
            transition: background 0.15s var(--ease);
        }
        .drawer-item:hover { background: var(--surface-hover); }
        .drawer-item.now-playing { background: var(--accent-dim); }

        .drag-handle {
            color: var(--text-3);
            cursor: grab;
            font-size: 1rem;
            padding: 0 0.15rem;
            flex-shrink: 0;
            touch-action: none;
        }
        .drag-handle:active { cursor: grabbing; }

        .drawer-item-info {
            flex: 1;
            min-width: 0;
        }
        .drawer-item-title {
            font-size: 0.82rem;
            color: var(--text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .drawer-item-author {
            font-size: 0.7rem;
            color: var(--text-3);
        }
        .drawer-item .now-badge {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            margin-left: 0.4rem;
        }

        .drawer-item-remove {
            background: none;
            border: none;
            color: var(--text-3);
            cursor: pointer;
            padding: 0.3rem;
            font-size: 0.85rem;
            transition: color 0.15s;
            flex-shrink: 0;
        }
        .drawer-item-remove:hover { color: var(--error); }

        .drawer-empty {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-3);
            font-size: 0.85rem;
        }

        .sortable-ghost {
            opacity: 0.4;
            background: var(--surface-active);
        }
    </style>
    <style id="page-styles">{% block styles %}{% endblock %}</style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    <div class="fog" id="global-fog" aria-hidden="true"><div class="fog-l3"></div></div>
    <script>
    (function () {
        var fog = document.getElementById('global-fog');
        if (!fog) return;
        var onSettings   = window.location.pathname.startsWith('/settings');
        var prevSettings = sessionStorage.getItem('fog-prev-settings') === '1';
        var everSettled  = sessionStorage.getItem('fog-settled')       === '1';
        if (onSettings) {
            sessionStorage.setItem('fog-prev-settings', '1');
            fog.classList.add('evaporate');
        } else {
            sessionStorage.setItem('fog-prev-settings', '0');
            if (!everSettled || prevSettings) {
                fog.classList.add('settle');
                sessionStorage.setItem('fog-settled', '1');
            } else {
                fog.classList.add('visible');
            }
        }
    })();
    </script>                                       
                                       
    <div id="page-content">{% block body %}{% endblock %}</div>

    <!-- Persistent audio element (survives SPA navigation) -->
    <audio id="persistent-audio" preload="none" playsinline></audio>

    <!-- Mini-Player Bar -->
    <div class="mini-player" id="mini-player">
        <div class="mini-progress" id="mini-progress-bar">
            <div class="mini-progress-fill" id="mini-progress-fill"></div>
        </div>
        <div class="mini-player-inner">
            <div class="mini-controls">
                <button class="mini-btn" id="mini-prev" title="Previous">&#9664;&#9664;</button>
                <button class="mini-btn play-pause" id="mini-play" title="Play/Pause">&#9654;</button>
                <button class="mini-btn" id="mini-next" title="Next">&#9654;&#9654;</button>
            </div>
            <div class="mini-info">
                <a href="#" id="mini-info-link">
                    <div class="mini-title" id="mini-title"></div>
                    <div class="mini-author" id="mini-author"></div>
                </a>
            </div>
            <div class="mini-right">
                <button class="mini-btn" id="mini-repeat" title="Repeat">&#128257;<span class="repeat-one-dot">1</span></button>
                <button class="mini-btn" id="mini-queue" title="Queue">&#9776;</button>
            </div>
        </div>
    </div>

    <!-- Playlist Drawer -->
    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <div class="playlist-drawer" id="playlist-drawer">
        <div class="drawer-header">
            <span class="drawer-title">Queue</span>
            <button class="drawer-clear" id="drawer-clear">Clear all</button>
        </div>
        <ul class="drawer-list" id="playlist-items"></ul>
    </div>

    <!-- Shared Toast -->
    <div class="toast" id="toast"></div>
    <div id="page-scripts">{% block scripts %}{% endblock %}</div>

    <!-- Load SortableJS for drag-to-reorder -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js" defer></script>

    <!-- Core modules (order matters: router, then player, then playlist) -->
    <script src="/static/js/router.js" defer></script>
    <script src="/static/js/player-core.js" defer></script>
    <script src="/static/js/playlist.js" defer></script>

    <!-- Mini-player & drawer wiring -->
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(function() {});
    }

    // Global toast utility
    window.showToast = function(msg) {
        var t = document.getElementById('toast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(function() { t.classList.remove('show'); }, 2200);
    };

    // Global escapeHtml utility
    window.escapeHtml = function(text) {
        var d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    };

    // Mini-player & Drawer wiring (runs after modules load)
    document.addEventListener('DOMContentLoaded', function() {
        var miniPlayer = document.getElementById('mini-player');
        var miniPlay = document.getElementById('mini-play');
        var miniPrev = document.getElementById('mini-prev');
        var miniNext = document.getElementById('mini-next');
        var miniRepeat = document.getElementById('mini-repeat');
        var miniQueue = document.getElementById('mini-queue');
        var miniTitle = document.getElementById('mini-title');
        var miniAuthor = document.getElementById('mini-author');
        var miniInfoLink = document.getElementById('mini-info-link');
        var miniProgressBar = document.getElementById('mini-progress-bar');
        var miniProgressFill = document.getElementById('mini-progress-fill');
        var drawerBackdrop = document.getElementById('drawer-backdrop');
        var playlistDrawer = document.getElementById('playlist-drawer');
        var playlistItems = document.getElementById('playlist-items');
        var drawerClear = document.getElementById('drawer-clear');
        var sortableInstance = null;

        function showMiniPlayer() {
            miniPlayer.classList.add('visible');
            document.body.classList.add('has-miniplayer');
        }
        function hideMiniPlayer() {
            miniPlayer.classList.remove('visible');
            document.body.classList.remove('has-miniplayer');
        }

        // ── PlayerCore events ──────────────────────────────
        PlayerCore.on('trackchange', function(data) {
            if (!data || !data.storyId) { hideMiniPlayer(); return; }
            miniTitle.textContent = data.title || 'Untitled';
            miniAuthor.textContent = data.author ? 'u/' + data.author : 'Voice In The Dark';
            miniInfoLink.href = '/listen/' + data.storyId;
            showMiniPlayer();
        });

        PlayerCore.on('play', function() {
            miniPlay.innerHTML = '&#10074;&#10074;';
        });

        PlayerCore.on('pause', function() {
            miniPlay.innerHTML = '&#9654;';
        });

        PlayerCore.on('timeupdate', function(data) {
            if (!data || !data.duration) return;
            var pct = (data.currentTime / data.duration) * 100;
            miniProgressFill.style.width = pct + '%';
        });

        // ── Mini-player controls ───────────────────────────
        miniPlay.addEventListener('click', function() { PlayerCore.togglePlay(); });
        miniPrev.addEventListener('click', function() { Playlist.prev(); });
        miniNext.addEventListener('click', function() { Playlist.next(); });

        miniRepeat.addEventListener('click', function() { Playlist.toggleRepeat(); });

        // Click on progress bar to seek
        miniProgressBar.addEventListener('click', function(e) {
            if (!PlayerCore.audio || !PlayerCore.audio.duration) return;
            var rect = miniProgressBar.getBoundingClientRect();
            var pct = (e.clientX - rect.left) / rect.width;
            PlayerCore.seek(pct * PlayerCore.audio.duration);
        });

        // ── Repeat button state ────────────────────────────
        Playlist.on('repeatchange', function(mode) {
            miniRepeat.classList.remove('repeat-active', 'repeat-one');
            if (mode === 'all') {
                miniRepeat.classList.add('repeat-active');
                miniRepeat.title = 'Repeat: All';
            } else if (mode === 'one') {
                miniRepeat.classList.add('repeat-active', 'repeat-one');
                miniRepeat.title = 'Repeat: One';
            } else {
                miniRepeat.title = 'Repeat: Off';
            }
        });

        // ── Queue drawer toggle ────────────────────────────
        var drawerOpen = false;
        function toggleDrawer() {
            drawerOpen = !drawerOpen;
            playlistDrawer.classList.toggle('open', drawerOpen);
            drawerBackdrop.classList.toggle('open', drawerOpen);
            if (drawerOpen) renderDrawer();
        }
        function closeDrawer() {
            drawerOpen = false;
            playlistDrawer.classList.remove('open');
            drawerBackdrop.classList.remove('open');
        }

        miniQueue.addEventListener('click', toggleDrawer);
        drawerBackdrop.addEventListener('click', closeDrawer);

        drawerClear.addEventListener('click', function() {
            Playlist.clear();
            closeDrawer();
        });

        // ── Render drawer list ─────────────────────────────
        function renderDrawer() {
            var items = Playlist.getItems();
            var currentIdx = Playlist.getCurrentIndex();
            playlistItems.innerHTML = '';

            if (items.length === 0) {
                playlistItems.innerHTML = '<li class="drawer-empty">Queue is empty. Add stories from the story list.</li>';
                return;
            }

            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                var li = document.createElement('li');
                li.className = 'drawer-item' + (i === currentIdx ? ' now-playing' : '');
                li.dataset.index = i;

                li.innerHTML =
                    '<span class="drag-handle">&#9776;</span>' +
                    '<div class="drawer-item-info">' +
                        '<div class="drawer-item-title">' + escapeHtml(item.title || 'Untitled') +
                            (i === currentIdx ? '<span class="now-badge">Playing</span>' : '') +
                        '</div>' +
                        '<div class="drawer-item-author">' + (item.author ? 'u/' + escapeHtml(item.author) : '') + '</div>' +
                    '</div>' +
                    '<button class="drawer-item-remove" data-idx="' + i + '" title="Remove">&times;</button>';

                playlistItems.appendChild(li);
            }

            // Wire click-to-play
            playlistItems.querySelectorAll('.drawer-item-info').forEach(function(el) {
                el.addEventListener('click', function() {
                    var idx = parseInt(el.parentElement.dataset.index);
                    Playlist.playAt(idx);
                });
            });

            // Wire remove buttons
            playlistItems.querySelectorAll('.drawer-item-remove').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var idx = parseInt(btn.dataset.idx);
                    Playlist.removeAt(idx);
                });
            });

            // Init SortableJS
            if (sortableInstance) sortableInstance.destroy();
            if (typeof Sortable !== 'undefined') {
                sortableInstance = Sortable.create(playlistItems, {
                    handle: '.drag-handle',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: function(evt) {
                        Playlist.reorder(evt.oldIndex, evt.newIndex);
                    }
                });
            }
        }

        Playlist.on('queuechange', function() {
            if (drawerOpen) renderDrawer();
        });

        // Show mini-player if track was restored from localStorage
        if (PlayerCore.storyId) {
            showMiniPlayer();
        }
    });
    </script>
</body>
</html>
