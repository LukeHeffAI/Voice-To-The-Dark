<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0{% block viewport_extra %}{% endblock %}">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Voice To The Dark">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>{% block title %}Voice To The Dark{% endblock %}</title>
    <style>
        :root {
            --bg: #050505;
            --surface: rgba(255,255,255,0.025);
            --surface-hover: rgba(255,255,255,0.04);
            --surface-active: rgba(255,255,255,0.055);
            --elevated: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.12);
            --border-focus: rgba(160,32,32,0.5);
            --text-1: #e8e6e3;
            --text-2: #8a8a8a;
            --text-3: #555;
            --accent: #a02020;
            --accent-hover: #bf2626;
            --accent-dim: rgba(160,32,32,0.12);
            --accent-glow: 0 0 30px rgba(160,32,32,0.2);
            --success: #3a7d5c;
            --success-dim: rgba(58,125,92,0.12);
            --info: #6868b8;
            --info-dim: rgba(104,104,184,0.12);
            --warn: #b8a040;
            --warn-dim: rgba(184,160,64,0.12);
            --ambient: #48b8b8;
            --ambient-dim: rgba(72,184,184,0.1);
            --error: #c44;
            --error-dim: rgba(204,68,68,0.1);
            --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
            --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --r-sm: 6px;
            --r-md: 10px;
            --r-lg: 16px;
            --r-xl: 24px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--sans);
            background: var(--bg);
            background-image: radial-gradient(ellipse at 50% 0%, #0a0808 0%, var(--bg) 70%);
            color: var(--text-1);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 15px;
            line-height: 1.5;
        }
        /* Film grain overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 10000;
        }
        /* Vignette */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,0.35) 100%);
            pointer-events: none;
            z-index: 9999;
        }

        /* ── Shared components ─────────────────────────────── */

        .auth-nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 1.25rem;
            padding: 0.75rem 0;
            font-size: 0.8rem;
        }
        .auth-nav a {
            color: var(--text-3);
            text-decoration: none;
            transition: color 0.2s var(--ease);
            letter-spacing: 0.02em;
        }
        .auth-nav a:hover { color: var(--text-2); }
        .auth-nav a:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 3px;
            border-radius: var(--r-sm);
        }
        .auth-nav .username {
            color: var(--text-2);
            font-weight: 500;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-3);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 0.5rem 0;
            transition: color 0.2s var(--ease);
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .back-link:hover { color: var(--text-2); }
        .back-link:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 3px;
            border-radius: var(--r-sm);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 1.5rem;
            border: none;
            border-radius: var(--r-md);
            background: var(--accent);
            color: #fff;
            font-family: var(--sans);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s var(--ease);
            letter-spacing: 0.02em;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: var(--accent-glow);
        }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            box-shadow: var(--accent-glow);
        }
        .btn-primary:disabled {
            background: rgba(255,255,255,0.06);
            color: var(--text-3);
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.55rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            background: transparent;
            color: var(--text-2);
            font-family: var(--sans);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s var(--ease);
            letter-spacing: 0.02em;
        }
        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-1);
            background: var(--surface);
        }
        .btn-secondary:focus-visible {
            outline: 2px solid var(--border-focus);
            outline-offset: 3px;
            border-color: var(--border-focus);
        }

        .form-message {
            margin-top: 0.75rem;
            padding: 0.7rem 1rem;
            border-radius: var(--r-sm);
            font-size: 0.82rem;
            display: none;
            line-height: 1.4;
        }
        .form-message.error {
            display: block;
            background: var(--error-dim);
            border: 1px solid rgba(204,68,68,0.2);
            color: #e07070;
        }
        .form-message.success {
            display: block;
            background: var(--success-dim);
            border: 1px solid rgba(58,125,92,0.2);
            color: #6ecf9a;
        }

        .badge {
            display: inline-block;
            padding: 0.15rem 0.55rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.4rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .step-status { font-size: 0.8rem; color: var(--text-3); margin-top: 0.5rem; }
        .step-status.error { color: #e07070; }
        .step-status.success { color: var(--success); }

        .login-prompt {
            text-align: center;
            padding: 1.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--r-md);
            font-size: 0.85rem;
            color: var(--text-2);
        }
        .login-prompt a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .login-prompt a:hover { text-decoration: underline; }

        {% block styles %}{% endblock %}
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js').catch(function() {});
    }
    </script>
</body>
</html>
